    <h1>測試問題回報</h1>
    <p>
      目前尚未設定公開客服信箱，請將以下內容透過提供你測試版本的管道回報。這個頁面不會自動傳送任何資料。
    </p>
    <h2>哪裡卡住了？記下來給我們看</h2>
    <label for="report">把有關的地方填一填，再複製回報</label
    ><textarea id="report" rows="13">
版本：Little Daily 測試版 1.6
手機／電腦型號：
作業系統與版本：
瀏覽器與版本：
使用方式：一般瀏覽器／加入主畫面
問題發生的工具：
操作步驟：
本來以為會怎樣：
結果卻變成：
是否能重複發生：
備註：</textarea>
    <p>
      附截圖前，先遮住私人金額、寵物名字和日記。備份裡可能有完整紀錄，確認內容、確定願意分享，再交給別人。
    </p>
    <h2>紀錄怪怪的，先別急著清掉</h2>
    <ol>
      <li>不要先清除瀏覽器網站資料。</li>
      <li>若工具仍能讀取，先到首頁下載備份。</li>
      <li>
        查看「自動復原點」，可先下載較早的副本。找回功能只合併缺少的紀錄，不會覆寫目前內容。
      </li>
      <li>記下問題發生的操作與時間，再回報。</li>
    </ol>
