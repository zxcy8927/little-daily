name: 測試與正式建置
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: 驗證可部署版本
    runs-on: ubuntu-latest
    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4
      - name: 準備 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安裝鎖定版本依賴
        run: npm ci
      - name: 執行自動測試
        run: npm test
      - name: 建置正式網站
        run: npm run build
      - name: 驗證離線資源與圖示
        run: npm run check:release
      - name: 保存可部署網站
        uses: actions/upload-artifact@v4
        with:
          name: little-daily-web
          path: dist/
          retention-days: 14
